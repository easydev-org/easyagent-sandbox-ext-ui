name: release

# BUILDS THE PANEL AND ATTACHES THE BUNDLE TO A RELEASE, under the asset name easyagent-ext-ui-host
# fetches.
#
# THE TYPES ARE CHECKED AGAINST THE BACKEND'S PROTO, which this repository keeps a byte-identical copy
# of. A field the panel reads but the extension does not send is a compile error here, in the
# repository where the fix belongs.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

env:
  BACKEND: easydev-org/easyagent-sandbox-ext
  PROTO_PATH: ui/v1/ui.proto

permissions:
  contents: write
  # `npm ci` resolves @easydev-org/ext-ui from npm.pkg.github.com. A private package needs an
  # authenticated read, and GITHUB_TOKEN is enough — no PAT, nothing to rotate.
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - run: npm ci --no-audit --no-fund
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # THE COPY IS COMPARED, not trusted. GITHUB_TOKEN scopes to THIS repository, so a private backend
      # answers 404 whatever header is sent — a check that could never pass is not a check, so an
      # unreadable backend is a warning with the instruction that fixes it (PROTO_READ_TOKEN).
      - name: is the copy still the contract?
        id: drift
        env:
          PROTO_READ_TOKEN: ${{ secrets.PROTO_READ_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          tok="${PROTO_READ_TOKEN:-$GH_TOKEN}"
          url="https://raw.githubusercontent.com/${BACKEND}/main/proto/${PROTO_PATH}"
          code=$(curl -sS -o /tmp/up.proto -w '%{http_code}' -H "Authorization: Bearer ${tok}" "$url" || true)
          if [ "$code" != "200" ]; then
            echo "same=unknown" >> "$GITHUB_OUTPUT"
            echo "::warning::cannot read ${BACKEND}'s proto (HTTP $code); set PROTO_READ_TOKEN to enable the drift check"
            exit 0
          fi
          if diff -q /tmp/up.proto "proto/${PROTO_PATH}" >/dev/null; then
            echo "same=true" >> "$GITHUB_OUTPUT"
          else
            echo "same=false" >> "$GITHUB_OUTPUT"
            echo "::notice::the backend's proto changed; taking theirs"
            diff -u "proto/${PROTO_PATH}" /tmp/up.proto || true
            cp /tmp/up.proto "proto/${PROTO_PATH}"
          fi

      - name: generate
        run: |
          set -euo pipefail
          export PATH="${PWD}/node_modules/.bin:${PATH}"
          cd proto && buf lint && buf generate

      # FORMAT AND LINT, BEFORE THE TYPE CHECK. `npm run build` succeeds on misformatted code, so
      # without this step a formatting problem has no signal at all: it surfaces as churn in a later
      # diff.
      #
      # IT FAILS RATHER THAN FIXING. A CI job that rewrites files and passes leaves the diff on a
      # runner nobody reads; the author has to run `npm run format:fix` and see it in their own diff.
      - name: format
        run: npm run format:check

      # SVELTE FILES, BECAUSE BIOME CANNOT FORMAT THEM. It parses the <script> block as a standalone
      # TypeScript file — rewriting that block's indentation while leaving the markup and <style>
      # untouched — which produces a HALF-FORMATTED file, worse than none. Prettier with
      # prettier-plugin-svelte understands all three blocks and their relationship.
      #
      # THIS IS NOT A DUPLICATE OF THE STEP ABOVE. Biome owns .ts and .json; prettier owns .svelte.
      # Splitting by file type is why the two tools do not fight.
      - name: format (svelte)
        run: npm run format:svelte

      - run: npm run check
      - run: npm run build

      - name: the bundle is complete
        run: |
          set -euo pipefail
          test -f dist/index.html || { echo "::error::dist/index.html is missing"; exit 1; }
          test -f dist/ui.json     || { echo "::error::dist/ui.json is missing"; exit 1; }
          # THE ASSETS MUST POINT AT THE MOUNT. A bundle built for another base is every asset 404ing,
          # which a browser reports as a blank panel with nothing in the log naming the file.
          grep -q 'src="/ext/sandbox/assets/' dist/index.html || {
            echo "::error::the bundle does not reference /ext/sandbox/assets — wrong vite base"
            grep -o 'src="[^"]*"' dist/index.html | head -5; exit 1; }
          python3 -c "import json; d=json.load(open('dist/ui.json')); assert d.get('title'); print('ui.json ok:', d['title'])"

      - name: pack
        run: |
          set -euo pipefail
          tar -czf ui.tar.gz -C dist .
          echo "packed $(find dist -type f | wc -l) files, $(du -h ui.tar.gz | cut -f1)"

      - uses: actions/upload-artifact@v4
        with:
          name: ui-bundle
          path: ui.tar.gz

      - name: publish
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" ui.tar.gz \
            --title "${GITHUB_REF_NAME}" \
            --notes "The sandbox panel, as installed by easyagent-ext-ui-host."

      # A DRIFTED COPY BECOMES A PULL REQUEST rather than a push: the diff is the thing to read, and a
      # change to the contract should be signed off rather than discovered.
      - name: open the pull request
        if: steps.drift.outputs.same == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet; then echo "nothing to commit"; exit 0; fi
          branch="proto/sync-$(date +%Y%m%d-%H%M%S)"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A
          {
            echo "chore: regenerate the client from the backend's proto"
            echo
            echo "The .proto here is a copy of ${BACKEND}'s and no longer matched. Ingested theirs and"
            echo "regenerated, so client and server cannot disagree about a field name."
          } > /tmp/msg.txt
          git commit -F /tmp/msg.txt
          git push -u origin "$branch"
          gh pr create --title "chore: sync the proto from the backend" --body "Opened by CI because \`${BACKEND}\`'s \`proto/${PROTO_PATH}\` changed."
